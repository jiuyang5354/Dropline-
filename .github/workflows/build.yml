name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        shell: pwsh
        run: dotnet build windows/Dropline.csproj -c Release -o windows/bin
      - name: Fetch WebP tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 'webp'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $ok = $false
          foreach ($v in '1.5.0', '1.4.0') {
            try {
              $zip = Join-Path $tools "libwebp-$v.zip"
              Invoke-WebRequest "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-$v-windows-x64.zip" -OutFile $zip
              Expand-Archive $zip -DestinationPath $tools -Force
              $ok = $true; break
            } catch { Write-Host "libwebp $v unavailable: $_" }
          }
          if (-not $ok) { throw 'Could not download libwebp' }
          foreach ($exe in 'cwebp.exe', 'dwebp.exe') {
            $f = Get-ChildItem $tools -Recurse -Filter $exe | Select-Object -First 1
            if (-not $f) { throw "$exe not found in libwebp archive" }
            Copy-Item $f.FullName windows/bin/
          }
          Get-ChildItem $tools -Recurse -Filter COPYING | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName windows/bin/libwebp-COPYING.txt }
      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev-' + $env:GITHUB_SHA.Substring(0,7) }
          $stage = Join-Path $env:RUNNER_TEMP 'Dropline'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item windows/bin/Dropline.exe, windows/bin/Dropline.exe.config, windows/bin/cwebp.exe, windows/bin/dwebp.exe -Destination $stage
          if (Test-Path windows/bin/libwebp-COPYING.txt) { Copy-Item windows/bin/libwebp-COPYING.txt -Destination $stage }
          Copy-Item LICENSE, README.md -Destination $stage
          $zip = "Dropline-Windows-$version.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + '  ' + $zip | Set-Content SHA256SUMS.txt -Encoding ascii
          "zip=$zip" | Add-Content $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Dropline-Windows
          path: |
            ${{ steps.pkg.outputs.zip }}
            SHA256SUMS.txt
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME '${{ steps.pkg.outputs.zip }}' SHA256SUMS.txt --title "Dropline $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --prerelease
